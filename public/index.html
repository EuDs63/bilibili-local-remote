<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090c12" />
    <title>网页视频床上遥控器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="pair-view" class="pair-view" aria-labelledby="pair-title">
        <div class="brand-mark" aria-hidden="true">▶</div>
        <p class="eyebrow">仅在家中局域网运行</p>
        <h1 id="pair-title">连接床尾的电脑</h1>
        <p class="muted">在电脑黑色窗口中找到六位配对码，输入一次即可。</p>
        <form id="pair-form" class="pair-form" novalidate>
          <label for="pair-code">六位配对码</label>
          <input id="pair-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="000000" required />
          <button id="pair-submit" class="primary" type="submit">连接遥控器</button>
        </form>
        <p id="pair-error" class="error" role="alert"></p>
      </section>

      <section id="remote-view" class="remote-view" hidden>
        <header class="topbar">
          <div>
            <p class="eyebrow">WEB VIDEO · BED REMOTE</p>
            <h1>床上遥控器</h1>
          </div>
          <div id="connection" class="connection" data-state="waiting">
            <span class="connection-dot"></span>
            <span id="connection-text">正在连接</span>
          </div>
        </header>

        <section class="now-playing" aria-live="polite">
          <p id="site-name" class="section-label">正在播放</p>
          <h2 id="video-title">等待电脑上的网页视频…</h2>
          <input id="progress" class="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" />
          <div class="time-row"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
        </section>

        <section class="transport" aria-label="播放控制">
          <button id="previous-action" class="round secondary" data-command="seekBy" data-value="-60" aria-label="快退一分钟"><span>−1 min</span></button>
          <button id="seek-back" class="round secondary" data-command="seekBy" data-value="-10" data-hold-seek="-1" aria-label="快退"><strong>−10</strong><span>秒</span></button>
          <button id="play-toggle" class="round play" data-command="toggle" aria-label="播放或暂停"><span id="play-icon">▶</span></button>
          <button id="seek-forward" class="round secondary" data-command="seekBy" data-value="10" data-hold-seek="1" aria-label="快进"><strong>+10</strong><span>秒</span></button>
          <button id="next-action" class="round secondary" data-command="seekBy" data-value="60" aria-label="快进一分钟"><span>+1 min</span></button>
        </section>

        <details id="tabs-panel" class="panel feature-panel" open>
          <summary>浏览器标签页</summary>
          <p class="muted tab-help">普通页面的“切换”只聚焦浏览器标签，不改变当前视频遥控目标或锁定。</p>
          <p id="tabs-status" class="tab-status">全部标签页与分组</p>
          <div id="tabs-list" class="item-list"><p class="muted">正在等待扩展同步标签页列表</p></div>
        </details>

        <section class="panel compact-settings">
          <label>跳转步长
            <select id="seek-step"><option>5</option><option selected>10</option><option>15</option><option>30</option><option>60</option></select>
          </label>
          <label><input id="large-mode" type="checkbox" /> 大按钮模式</label>
        </section>

        <section class="panel volume-panel">
          <button class="icon-button" data-command="mute" aria-label="静音">音量</button>
          <input id="volume" type="range" min="0" max="1" value="0.7" step="0.02" aria-label="音量" />
          <output id="volume-value">70%</output>
        </section>

        <section class="panel">
          <div class="panel-heading"><span>播放速度</span><strong id="speed-value">1×</strong></div>
          <div class="speed-grid" role="group" aria-label="播放速度">
            <button data-command="speed" data-value="0.5">0.5×</button>
            <button data-command="speed" data-value="0.75">0.75×</button>
            <button data-command="speed" data-value="1" class="active">1×</button>
            <button data-command="speed" data-value="1.25">1.25×</button>
            <button data-command="speed" data-value="1.5">1.5×</button>
            <button data-command="speed" data-value="2">2×</button>
          </div>
        </section>

        <section class="utility-grid" aria-label="播放器功能">
          <button data-command="toggleDanmaku" data-capability="danmaku"><span class="utility-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 3V6Z"/><path d="M8 10h2m3 0h3"/></svg></span><span>开关弹幕</span></button>
          <button data-command="webFullscreen" data-capability="fullscreen"><span class="utility-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M8 20H4v-4m12 4h4v-4"/></svg></span><span>播放器全屏</span></button>
          <button id="current-tab-close" class="close-tab" data-command="closeTab" disabled><span class="utility-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></span><span>关闭当前视频页</span></button>
        </section>

        <section class="open-video panel">
          <div class="panel-heading"><span>在电脑上打开视频</span></div>
          <form id="url-form">
            <input id="video-url" type="text" inputmode="url" placeholder="粘贴链接或完整分享文案" required />
            <button type="submit">打开</button>
          </form>
        </section>

        <details id="episodes-panel" class="panel feature-panel">
          <summary>分集</summary>
          <div id="episodes-list" class="item-list"><p class="muted">当前页面未提供分集</p></div>
        </details>

        <details id="queue-panel" class="panel feature-panel">
          <summary>播放队列</summary>
          <form id="queue-form" class="stack-form">
            <label for="queue-links">批量视频链接</label>
            <textarea id="queue-links" rows="3" placeholder="粘贴多个链接，每行一个"></textarea>
            <button type="submit">加入队列</button>
          </form>
          <div id="queue-list" class="item-list"></div>
        </details>

        <details id="library-panel" class="panel feature-panel">
          <summary>时间书签与最近播放</summary>
          <form id="bookmark-form" class="stack-form">
            <label for="bookmark-note">书签备注</label>
            <input id="bookmark-note" type="text" placeholder="书签备注（可选）" />
            <button type="submit">保存当前时间点</button>
          </form>
          <h3>书签</h3><div id="bookmarks-list" class="item-list"></div>
          <h3>最近播放</h3><div id="history-list" class="item-list"></div>
        </details>

        <footer>
          <p id="hint">电脑需保持本地服务和视频页面开启</p>
          <button id="forget" class="text-button" type="button">忘记这台电脑</button>
        </footer>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/features.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
